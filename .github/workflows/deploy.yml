name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # permite correr manualmente no separador Actions

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --watch=false

      # base-href = nome do repositório (GitHub Pages de projeto)
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/

      # fallback SPA: o GitHub Pages serve 404.html em rotas desconhecidas
      - run: cp dist/the-lost-canvas-studios/browser/404/index.html
            dist/the-lost-canvas-studios/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/the-lost-canvas-studios/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
